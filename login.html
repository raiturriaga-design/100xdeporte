<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07101d">

  <title>100XDeporte | Iniciar sesión</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07101d;
      --panel: #0d1a29;
      --panel2: #101f31;
      --line: #294054;
      --green: #a8ff00;
      --cyan: #36d9ff;
      --text: #f4f7fb;
      --muted: #91a2b4;
      --red: #ff5268;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% 0%,
          #16324b 0,
          transparent 45%
        ),
        var(--bg);

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      margin-bottom: 25px;
    }

    .logo span {
      color: var(--green);
    }

    .card {
      background: linear-gradient(
        145deg,
        #102131,
        #0b1725
      );

      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, .35);
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 16px;

      border: 1px solid var(--line);
      border-radius: 10px;

      background: #081522;
      color: white;

      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(168,255,0,.10);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;

      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: var(--green);
      color: #07101d;
      margin-top: 4px;
    }

    .primary:hover {
      filter: brightness(1.08);
    }

    .secondary {
      margin-top: 10px;
      background: #17283a;
      border: 1px solid var(--line);
      color: white;
    }

    .secondary:hover {
      border-color: var(--green);
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.4;
    }

    .success {
      display: block;
      background: rgba(168,255,0,.10);
      border: 1px solid rgba(168,255,0,.35);
      color: var(--green);
    }

    .error {
      display: block;
      background: rgba(255,82,104,.10);
      border: 1px solid rgba(255,82,104,.35);
      color: #ff8292;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 23px 0;
    }

    .back {
      display: block;
      text-align: center;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      margin-top: 20px;
    }

    .back:hover {
      color: var(--green);
    }

    .user-box {
      display: none;
      text-align: center;
    }

    .user-box h2 {
      margin-bottom: 10px;
      color: var(--green);
    }

    .user-email {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .loading {
      opacity: .6;
      pointer-events: none;
    }

    @media(max-width:500px) {
      .card {
        padding: 22px;
      }

      .logo {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      100<span>x</span>deporte
    </div>

    <div class="card">

      <!-- LOGIN / REGISTRO -->

      <div id="authBox">

        <h1 id="titulo">Iniciar sesión</h1>

        <p class="subtitle" id="subtitulo">
          Entra a tu cuenta de 100XDeporte para guardar
          tus puntos, rachas y progreso.
        </p>

        <label for="email">Correo electrónico</label>

        <input
          id="email"
          type="email"
          placeholder="tucorreo@email.com"
          autocomplete="email"
        >

        <label for="password">Contraseña</label>

        <input
          id="password"
          type="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="current-password"
        >

        <button
          id="mainButton"
          class="primary"
          onclick="iniciarSesion()"
        >
          Iniciar sesión
        </button>

        <button
          id="registerButton"
          class="secondary"
          onclick="registrarse()"
        >
          Crear una cuenta
        </button>

        <div id="message" class="message"></div>

      </div>


      <!-- USUARIO LOGUEADO -->

      <div id="userBox" class="user-box">

        <h2>¡Bienvenido a 100XDeporte! 🏆</h2>

        <div
          id="userEmail"
          class="user-email"
        ></div>

        <button
          class="primary"
          onclick="irAlInicio()"
        >
          Entrar a 100XDeporte
        </button>

        <button
          class="secondary"
          onclick="cerrarSesion()"
        >
          Cerrar sesión
        </button>

      </div>

      <div class="divider"></div>

      <a
        class="back"
        href="index.html"
      >
        ← Volver a 100XDeporte
      </a>

    </div>

  </div>


<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://wdnrwapmyvrmqhzsxmt.supabase.co";

/*
   IMPORTANTE:

   Aquí debes poner la ANON KEY pública de tu proyecto
   de Supabase.

   NO pongas la service_role key.
*/

const SUPABASE_ANON_KEY =
  "sb_publishable_1QU5E8zJ3ltDVUY5_YQf0w_5sI5p9h0;


/* =====================================================
   CREAR CLIENTE SUPABASE
   ===================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   ELEMENTOS
   ===================================================== */

const authBox =
  document.getElementById("authBox");

const userBox =
  document.getElementById("userBox");

const message =
  document.getElementById("message");

const userEmail =
  document.getElementById("userEmail");


/* =====================================================
   MENSAJES
   ===================================================== */

function mostrarMensaje(texto, tipo) {

  message.textContent = texto;

  message.className =
    "message " + tipo;
}


function limpiarMensaje() {

  message.textContent = "";

  message.className =
    "message";
}


/* =====================================================
   INICIAR SESIÓN
   ===================================================== */

async function iniciarSesion() {

  limpiarMensaje();

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;

  if (!email || !password) {

    mostrarMensaje(
      "Completa tu correo y contraseña.",
      "error"
    );

    return;
  }

  const button =
    document.getElementById("mainButton");

  button.classList.add("loading");

  button.textContent =
    "Iniciando sesión...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  button.classList.remove("loading");

  button.textContent =
    "Iniciar sesión";


  if (error) {

    console.error(error);

    mostrarMensaje(
      "No se pudo iniciar sesión: " +
      error.message,
      "error"
    );

    return;
  }


  mostrarUsuario(
    data.user
  );
}


/* =====================================================
   REGISTRARSE
   ===================================================== */

async function registrarse() {

  limpiarMensaje();

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;


  if (!email || !password) {

    mostrarMensaje(
      "Escribe tu correo y una contraseña.",
      "error"
    );

    return;
  }


  if (password.length < 6) {

    mostrarMensaje(
      "La contraseña debe tener al menos 6 caracteres.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById("registerButton");

  button.classList.add("loading");

  button.textContent =
    "Creando cuenta...";


  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });


  button.classList.remove("loading");

  button.textContent =
    "Crear una cuenta";


  if (error) {

    console.error(error);

    mostrarMensaje(
      "No se pudo crear la cuenta: " +
      error.message,
      "error"
    );

    return;
  }


  /*
    Si Supabase requiere confirmación
    del correo, mostramos este mensaje.
  */

  if (
    data.user &&
    !data.session
  ) {

    mostrarMensaje(
      "Cuenta creada. Revisa tu correo para confirmar tu cuenta.",
      "success"
    );

    return;
  }


  if (data.user) {

    mostrarUsuario(
      data.user
    );
  }
}


/* =====================================================
   MOSTRAR USUARIO
   ===================================================== */

function mostrarUsuario(user) {

  authBox.style.display =
    "none";

  userBox.style.display =
    "block";

  userEmail.textContent =
    user.email || "";
}


/* =====================================================
   COMPROBAR SESIÓN AL ABRIR
   ===================================================== */

async function comprobarSesion() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (
    session &&
    session.user
  ) {

    mostrarUsuario(
      session.user
    );
  }
}


/* =====================================================
   ESCUCHAR CAMBIOS DE SESIÓN
   ===================================================== */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (
      session &&
      session.user
    ) {

      mostrarUsuario(
        session.user
      );
    }

  }
);


/* =====================================================
   CERRAR SESIÓN
   ===================================================== */

async function cerrarSesion() {

  await supabaseClient.auth.signOut();

  userBox.style.display =
    "none";

  authBox.style.display =
    "block";

  document.getElementById("email").value =
    "";

  document.getElementById("password").value =
    "";

  limpiarMensaje();
}


/* =====================================================
   IR AL INICIO
   ===================================================== */

function irAlInicio() {

  window.location.href =
    "index.html";
}


/* =====================================================
   INICIAR
   ===================================================== */

comprobarSesion();

</script>

</body>
</html>
