name: Actualizar noticias

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-noticias:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener noticias
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["NEWS_API_KEY"]

          params = {
              "q": "fútbol OR básquetbol OR tenis OR voleibol",
              "language": "es",
              "sortBy": "publishedAt",
              "pageSize": "20",
          }

          url = "https://newsapi.org/v2/everything?" + urllib.parse.urlencode(params)

          request = urllib.request.Request(
              url,
              headers={"X-Api-Key": api_key}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          if data.get("status") != "ok":
              raise RuntimeError(data.get("message", "Error al obtener noticias"))

          noticias = []

          for article in data.get("articles", []):
              noticias.append({
                  "titulo": article.get("title"),
                  "descripcion": article.get("description"),
                  "url": article.get("url"),
                  "imagen": article.get("urlToImage"),
                  "fuente": article.get("source", {}).get("name"),
                  "fecha": article.get("publishedAt")
              })

          with open("noticias.json", "w", encoding="utf-8") as archivo:
              json.dump(noticias, archivo, ensure_ascii=False, indent=2)

          print(f"Noticias guardadas: {len(noticias)}")
          PY

      - name: Guardar noticias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || git commit -m "Actualizar noticias"
          git push
